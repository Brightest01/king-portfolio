<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="king-styles.css">
</head>
<body>

<header class="header">
  <!-- SAME HEADER -->
</header>

<section class="page-banner">
  <h1>Contact Us</h1>
</section>

<section class="contact-container">

  <div class="contact-info">
    <h2>Let's Discuss Your Project</h2>

    <p>Email: support@linkserveplatforms.com</p>
    <p>Phone: Coming Soon</p>
  </div>

  <form
    action="mailto:support@linkserveplatforms.com"
    method="POST"
    enctype="text/plain"
    class="contact-form"
  >

    <input type="text" name="name" placeholder="Your Name" required>

    <input type="email" name="email" placeholder="Your Email" required>

    <input type="text" name="subject" placeholder="Subject" required>

    <textarea
      name="message"
      rows="6"
      placeholder="Tell us about your project..."
      required
    ></textarea>

    <button type="submit" class="btn">Send Message</button>

  </form>

</section>

<footer class="footer">
  <!-- SAME FOOTER -->
</footer>

<script src="king-script.js"></script>
</body>
</html>
